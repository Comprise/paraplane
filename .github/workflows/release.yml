name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# One release run per tag. A run waiting behind another is not cancelled
# (cancel-in-progress is false), and different tags do not share a group, so a
# pushed v1.2.1 never drops a waiting v1.2.0.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    # A tag reaches every user, so only a tag on a green commit from main may
    # publish.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is semver
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || {
            echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-pre]"; exit 1; }
      - name: Tag commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: ci is green on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success" --jq '.total_count')
          [ "${n:-0}" -ge 1 ] || { echo "::error::no successful ci run on $GITHUB_SHA; wait for main to be green before tagging"; exit 1; }

  test:
    needs: guard
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # The exact toolchain, the same as go.mod's toolchain line: a re-run
          # next week builds the same bytes.
          go-version: 1.27.3
          # No module cache from other runs in a release build.
          cache: false
      - run: go mod verify
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.goos == 'windows' && '.exe' || '' }}
        run: |
          go version
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
            -o "libexec/paraplane-${GOOS}-${GOARCH}${EXT}" ./cmd/paraplane
          go version -m "libexec/paraplane-${GOOS}-${GOARCH}${EXT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: libexec/*

  assemble:
    # Stamps, archives and checksums. It runs no third-party code. The
    # checksums leave this job as an output (not only inside the artifact), so
    # publish compares what it downloads with a value no later job can rewrite.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: libexec
          pattern: bin-*
          merge-multiple: true
      - name: Stamp plugin version
        # plugin.json on main has no version; the tag is the single source.
        run: |
          jq --arg v "${GITHUB_REF_NAME#v}" '.version=$v' .claude-plugin/plugin.json > claude-plugin.json.tmp && mv claude-plugin.json.tmp .claude-plugin/plugin.json
          jq --arg v "${GITHUB_REF_NAME#v}" '.version=$v' .codex-plugin/plugin.json > codex-plugin.json.tmp && mv codex-plugin.json.tmp .codex-plugin/plugin.json
      - name: Archive and checksums
        run: |
          chmod +x libexec/* bin/paraplane
          # ship.txt is the one list of what ships (CI and make tree read it too).
          mkdir dist
          tar -czf "dist/paraplane-${GITHUB_REF_NAME}.tar.gz" $(cat ship.txt)
          # Flat names, so `sha256sum -c` works in a directory with the
          # downloaded assets (the archive and the binaries are all assets).
          (cd libexec && sha256sum paraplane-*) > dist/checksums.txt
          (cd dist && sha256sum "paraplane-${GITHUB_REF_NAME}.tar.gz") >> dist/checksums.txt
      - name: Checksums as an output
        id: sums
        run: |
          {
            echo 'sums<<CHECKSUMS_END'
            cat dist/checksums.txt
            echo 'CHECKSUMS_END'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/*
          # A re-run of a failed job would otherwise hit a name conflict with
          # the dist artifact of the previous attempt.
          overwrite: true

  validate:
    # Runs npx (third-party code), so it holds no write scope and uploads
    # nothing: the artifacts stay as assemble made them.
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pin npm
        run: npm install -g npm@10.9.9
      - name: Validate the tree users install
        run: |
          mkdir -p "$RUNNER_TEMP/tree"
          tar -xzf "dist/paraplane-${GITHUB_REF_NAME}.tar.gz" -C "$RUNNER_TEMP/tree"
          # --strict fails the release on any validator warning; without it
          # validate exits 0 on them.
          # Skill and agent frontmatter is checked by TestSkillsFrontmatter, not here.
          cd "$RUNNER_TEMP/tree" && npx --yes @anthropic-ai/claude-code@2.1.304 plugin validate --strict .

  smoke:
    # Every shipped binary runs once, on its own OS and architecture, through
    # the shim of the archive users install.
    needs: assemble
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, bin: linux-amd64 }
          - { os: ubuntu-24.04-arm, bin: linux-arm64 }
          - { os: macos-15-intel, bin: darwin-amd64 }
          - { os: macos-14, bin: darwin-arm64 }
          - { os: windows-2022, bin: windows-amd64 }
          - { os: windows-11-arm, bin: windows-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: paraplane version through the shim and as the binary
        env:
          BIN: ${{ matrix.bin }}
        run: |
          mkdir tree
          tar -xzf "dist/paraplane-${GITHUB_REF_NAME}.tar.gz" -C tree
          cd tree
          want="${GITHUB_REF_NAME#v}"
          ext=""
          case "$BIN" in windows-*) ext=".exe" ;; esac
          got=$("libexec/paraplane-${BIN}${ext}" version | tr -d '\r')
          [ "$got" = "$want" ] || { echo "::error::binary $BIN version is '$got', want '$want'"; exit 1; }
          got=$(sh bin/paraplane version | tr -d '\r')
          [ "$got" = "$want" ] || { echo "::error::shim version is '$got', want '$want'"; exit 1; }

  publish:
    # Write scopes start here, after validation. GH_TOKEN is set only on the
    # steps that push or call gh.
    needs: [assemble, validate, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Unpack the validated archive
        # Over the checkout: the release branch then holds exactly the files
        # validate checked (stamped plugin.json and the built binaries). The
        # expected checksums come from the assemble job's output, not from the
        # artifact being checked.
        env:
          SUMS: ${{ needs.assemble.outputs.sums }}
        run: |
          printf '%s\n' "$SUMS" > expected.txt
          # The downloaded checksums.txt is itself an asset: it must equal the output.
          cmp expected.txt dist/checksums.txt
          # The archive (in dist/) and the binaries it held (in libexec/)
          # must match the checksums. Each check verifies at least one file,
          # or sha256sum fails.
          (cd dist && sha256sum --ignore-missing -c ../expected.txt)
          tar -xzf "dist/paraplane-${GITHUB_REF_NAME}.tar.gz"
          (cd libexec && sha256sum --ignore-missing -c ../expected.txt)
          test "$(ls libexec | wc -l)" -eq 6
      - name: Attest build provenance
        # The binaries, the archive and checksums.txt: what users download and
        # what the release branch holds.
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            libexec/*
            dist/*
      - name: Pick the branch
        id: branch
        # Releases go to the release branch; pre-releases (a hyphen in the tag)
        # go to release-next, the channel for trying hooks before they reach
        # everyone.
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) echo "branch=release-next" >> "$GITHUB_OUTPUT" ;;
            *) echo "branch=release" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Update the channel branch
        # Users install from release, so it only moves to a higher version (an
        # older tag pushed later would roll every user back). It holds only
        # what the plugin needs (plugin.json is stamped in the validated
        # archive). Each release is a new commit on top of the previous one
        # only, so the branch only fast-forwards (no force-push) without
        # pulling main's history into installs; the message names the tagged
        # commit. A re-run of the same version pushes nothing (verify-release
        # then checks the branch still matches the archive). It is pushed
        # before the GitHub Release, so a release never points at a stale
        # branch.
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          new="${GITHUB_REF_NAME#v}"
          if git fetch --quiet origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null; then
            cur=$(git show "refs/remotes/origin/${BRANCH}:.claude-plugin/plugin.json" | jq -r '.version // "0.0.0"')
            # ~ sorts before the end of a version in sort -V, so 1.2.0-rc1 < 1.2.0.
            a=$(printf '%s' "$cur" | sed 's/-/~/')
            b=$(printf '%s' "$new" | sed 's/-/~/')
            if [ "$cur" = "$new" ] || [ "$(printf '%s\n%s\n' "$a" "$b" | sort -V | tail -1)" != "$b" ]; then
              echo "::notice::${BRANCH} is at $cur; $new is not newer, branch left as is"
              exit 0
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git rm -rq --cached .
          git add -f $(cat ship.txt)
          tree=$(git write-tree)
          parents=""
          if git rev-parse -q --verify "refs/remotes/origin/${BRANCH}" >/dev/null; then
            parents="-p refs/remotes/origin/${BRANCH}"
          fi
          commit=$(git commit-tree "$tree" $parents -m "release ${GITHUB_REF_NAME}" -m "source: ${GITHUB_SHA}")
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$commit:refs/heads/${BRANCH}"
      - name: GitHub Release
        # Tags with a hyphen (v0.1.0-rc1) are pre-releases. A re-run of a
        # published tag leaves the existing release alone.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "dist/paraplane-${GITHUB_REF_NAME}.tar.gz" dist/checksums.txt libexec/* --verify-tag --generate-notes $prerelease

  verify-release:
    # The channel branch must hold exactly the archive that was validated and
    # attested. After a re-run of an already published version this is the
    # check that catches a branch built from other bytes.
    needs: [assemble, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Compare the branch tree with the archive
        env:
          BRANCH: ${{ needs.publish.outputs.branch }}
          SUMS: ${{ needs.assemble.outputs.sums }}
        run: |
          printf '%s\n' "$SUMS" > expected.txt
          (cd dist && sha256sum --ignore-missing -c ../expected.txt)
          git fetch --quiet --depth=1 origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          have=$(git show "refs/remotes/origin/${BRANCH}:.claude-plugin/plugin.json" | jq -r '.version')
          want="${GITHUB_REF_NAME#v}"
          if [ "$have" != "$want" ]; then
            echo "::notice::${BRANCH} is at $have, not $want (an older tag); nothing to compare"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/archive" "$RUNNER_TEMP/branch"
          tar -xzf "dist/paraplane-${GITHUB_REF_NAME}.tar.gz" -C "$RUNNER_TEMP/archive"
          git archive "refs/remotes/origin/${BRANCH}" | tar -x -C "$RUNNER_TEMP/branch"
          diff -r "$RUNNER_TEMP/archive" "$RUNNER_TEMP/branch" || {
            echo "::error::the ${BRANCH} tree differs from the validated archive"; exit 1; }
