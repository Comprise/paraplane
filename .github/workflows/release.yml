name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency: release

jobs:
  guard:
    # A tag reaches every user, so only a tag on a commit from main may publish.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is semver
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || {
            echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-pre]"; exit 1; }
      - name: Tag commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  test:
    needs: guard
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # No module cache from other runs in a release build.
          cache: false
      - run: go mod verify
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.goos == 'windows' && '.exe' || '' }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
            -o "libexec/paraplane-${GOOS}-${GOARCH}${EXT}" ./cmd/paraplane
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: libexec/*

  validate:
    # Assembles, validates and smoke-tests the archive users install. It runs
    # npx (third-party code), so it holds no write scope and no token; publish
    # ships exactly the archive this job uploads.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: libexec
          pattern: bin-*
          merge-multiple: true
      - name: Stamp plugin version
        # plugin.json on main has no version; the tag is the single source.
        run: |
          jq --arg v "${GITHUB_REF_NAME#v}" '.version=$v' .claude-plugin/plugin.json > claude-plugin.json.tmp && mv claude-plugin.json.tmp .claude-plugin/plugin.json
          jq --arg v "${GITHUB_REF_NAME#v}" '.version=$v' .codex-plugin/plugin.json > codex-plugin.json.tmp && mv codex-plugin.json.tmp .codex-plugin/plugin.json
      - name: Archive and checksums
        run: |
          chmod +x libexec/* bin/paraplane
          # ship.txt is the one list of what ships (CI and make tree read it too).
          mkdir dist
          tar -czf "dist/paraplane-${GITHUB_REF_NAME}.tar.gz" $(cat ship.txt)
          sha256sum libexec/* "dist/paraplane-${GITHUB_REF_NAME}.tar.gz" | sed 's| dist/| |' > dist/checksums.txt
      - name: Validate the tree users install
        run: |
          mkdir -p "$RUNNER_TEMP/tree"
          tar -xzf "dist/paraplane-${GITHUB_REF_NAME}.tar.gz" -C "$RUNNER_TEMP/tree"
          # --strict fails the release on any validator warning; without it
          # validate exits 0 on them.
          # Skill and agent frontmatter is checked by TestSkillsFrontmatter, not here.
          cd "$RUNNER_TEMP/tree" && npx --yes @anthropic-ai/claude-code@2.1.304 plugin validate --strict .
      - name: Smoke test the shipped binary
        # The extracted tree, not the build dir: the binary and the shim must both
        # run from the archive and report the tag's version (without the v).
        run: |
          cd "$RUNNER_TEMP/tree"
          want="${GITHUB_REF_NAME#v}"
          got=$(libexec/paraplane-linux-amd64 version)
          [ "$got" = "$want" ] || { echo "::error::binary version is '$got', want '$want'"; exit 1; }
          got=$(sh bin/paraplane version)
          [ "$got" = "$want" ] || { echo "::error::shim version is '$got', want '$want'"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/*

  publish:
    # Write scopes start here, after validation. GH_TOKEN is set only on the
    # steps that push or call gh.
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Unpack the validated archive
        # Over the checkout: the release branch then holds exactly the files
        # validate checked (stamped plugin.json and the built binaries).
        run: |
          tar -xzf "dist/paraplane-${GITHUB_REF_NAME}.tar.gz"
          # The archive (in dist/) and the binaries it held (in libexec/)
          # must match the checksums validate wrote.
          (cd dist && sha256sum --ignore-missing -c checksums.txt)
          sha256sum --ignore-missing -c dist/checksums.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: 'libexec/*'
      - name: Update release branch
        # Users install from this branch, so pre-releases never reach it, and it
        # only moves to a higher version (an older tag pushed later would roll
        # every user back). It holds only what the plugin needs (plugin.json is
        # stamped in the validated archive). Each release is a new commit on top
        # of the previous one only, so the branch only fast-forwards (no force-push)
        # without pulling main's history into installs; the message names the
        # tagged commit. A re-run of the same version pushes nothing. It is
        # pushed before the GitHub Release, so a release never points at a
        # stale branch.
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new="${GITHUB_REF_NAME#v}"
          if git rev-parse -q --verify refs/remotes/origin/release >/dev/null; then
            cur=$(git show refs/remotes/origin/release:.claude-plugin/plugin.json | jq -r '.version // "0.0.0"')
            if [ "$cur" = "$new" ] || [ "$(printf '%s\n%s\n' "$cur" "$new" | sort -V | tail -1)" != "$new" ]; then
              echo "::notice::release branch is at $cur; $new is not newer, branch left as is"
              exit 0
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git rm -rq --cached .
          git add -f $(cat ship.txt)
          tree=$(git write-tree)
          parents=""
          if git rev-parse -q --verify refs/remotes/origin/release >/dev/null; then
            parents="-p refs/remotes/origin/release"
          fi
          commit=$(git commit-tree "$tree" $parents -m "release ${GITHUB_REF_NAME}" -m "source: ${GITHUB_SHA}")
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$commit:refs/heads/release"
      - name: GitHub Release
        # Tags with a hyphen (v0.1.0-rc1) are pre-releases. A re-run of a
        # published tag leaves the existing release alone.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "dist/paraplane-${GITHUB_REF_NAME}.tar.gz" dist/checksums.txt --generate-notes $prerelease
